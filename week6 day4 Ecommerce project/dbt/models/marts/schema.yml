version: 2

models:

  - name: fct_orders
    description: >
      Fact table containing all order transactions. Serves as the primary
      source for business reporting and analytics.

    columns:

      - name: ORDER_ID
        description: Unique identifier for each order.
        tests:
          - unique
          - not_null

      - name: CUSTOMER_ID
        description: Unique customer identifier.

      - name: PRODUCT_ID
        description: Unique product identifier.

      - name: CUSTOMER_NAME
        description: Full name of the customer.

      - name: COUNTRY
        description: Country where the customer is located.

      - name: AGE
        description: Customer age at the time of analysis.

      - name: GENDER
        description: Customer gender.

      - name: PRODUCT_NAME
        description: Name of the purchased product.

      - name: CATEGORY
        description: Product category (Electronics, Home, Kitchen, etc.).

      - name: PAYMENT_MODE
        description: Payment method used by the customer (Card, Cash, Transfer).

      - name: STATUS
        description: Current order status (COMPLETED, CANCELLED, PENDING).

      - name: AMOUNT
        description: Monetary value of the order.

      - name: ORDER_TIME
        description: Timestamp when the order was placed.

      - name: ORDER_DATE
        description: Date extracted from ORDER_TIME for reporting and aggregation.

      - name: SIGNUP_DATE
        description: Date when the customer registered.

      - name: CUSTOMER_TENURE_DAYS
        description: Number of days between customer signup and order placement.

      - name: ORDER_HOUR
        description: Hour of the day when the order occurred.

  - name: rpt_revenue_by_country
    description: >
      Revenue summary by customer country. Includes total revenue,
      total orders and average order value for completed orders.

    columns:

      - name: COUNTRY
        description: Country where the customer is located.

      - name: TOTAL_ORDERS
        description: Number of completed orders.

      - name: TOTAL_REVENUE
        description: Revenue generated from completed orders.

      - name: AVG_ORDER_VALUE
        description: Average revenue per completed order.

  - name: rpt_hourly_gmv
    description: >
      Hourly GMV report used for monitoring sales.

    columns:

      - name: ORDER_DATE
        description: Date of transactions.

      - name: ORDER_HOUR
        description: Hour of the day when the order occurred.

      - name: TOTAL_ORDERS
        description: Number of completed orders.

      - name: HOURLY_GMV
        description: Revenue generated during the hour.

  - name: rpt_top_products
    description: >
      Product performance report ranked by generated revenue.

    columns:

      - name: PRODUCT_ID
        description: Product identifier.

      - name: PRODUCT_NAME
        description: Product name.

      - name: CATEGORY
        description: Product category.

      - name: ORDERS_COUNT
        description: Number of completed orders.

      - name: REVENUE
        description: Revenue generated by the product.

  - name: rpt_order_status
    description: >
      Distribution of orders by status.

    columns:

      - name: STATUS
        description: Order status.

      - name: TOTAL_ORDERS
        description: Number of orders in the status.

      - name: PERCENTAGE
        description: Percentage of total orders.

  - name: rpt_daily_gmv
    description: >
      Daily GMV trend used for business performance tracking over time.

    columns:

      - name: ORDER_DATE
        description: Date of orders aggregated per day.
        tests:
          - not_null

      - name: TOTAL_ORDERS
        description: Total number of completed orders per day.

      - name: DAILY_GMV
        description: Total revenue generated per day.

      - name: AVG_ORDER_VALUE
        description: Average order value per day.